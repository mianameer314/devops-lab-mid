name: DevOps CI Pipeline

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    name: Run Automated Tests & Generate Report
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Tests & Generate Structured JSON Report
        id: run_tests
        continue-on-error: true
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          RECEIVER_URL: ${{ secrets.RECEIVER_URL }}
        run: |
          python run_tests_with_report.py
          echo "TEST_EXIT_CODE=$?" >> $GITHUB_ENV

      - name: Dispatch Report to Local Receiver (Fallback HTTP POST)
        if: always()
        env:
          RECEIVER_URL: ${{ secrets.RECEIVER_URL }}
        run: |
          if [ -n "$RECEIVER_URL" ] && [ -f "test-report.json" ]; then
            echo "Sending test report to: $RECEIVER_URL"
            curl -s -X POST -H "Content-Type: application/json" -d @test-report.json "$RECEIVER_URL" || echo "Warning: Receiver unreachable"
          else
            echo "Notice: RECEIVER_URL secret not set or test-report.json not found."
          fi

      - name: Archive Test Report as Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: test-report.json
          retention-days: 14

      # Bonus Task 2: Email Report (Runs on both passing and failing runs)
      - name: Send Email Report (Bonus)
        if: always()
        continue-on-error: true
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "[DevOps CI Report] ${{ github.repository }} - ${{ steps.run_tests.outcome == 'success' && 'PASSED' || 'FAILED' }} (${{ github.ref_name }})"
          to: ${{ secrets.MAIL_TO || secrets.MAIL_USERNAME }}
          from: DevOps CI Runner <${{ secrets.MAIL_USERNAME }}>
          body: |
            COMSATS DevOps Lab Mid - Automated Test Execution Report

            Repository: ${{ github.repository }}
            Branch: ${{ github.ref_name }}
            Commit SHA: ${{ github.sha }}
            Run ID: ${{ github.run_id }}
            Test Status: ${{ steps.run_tests.outcome == 'success' && 'PASSED' || 'FAILED' }}
            Timestamp: ${{ github.event.head_commit.timestamp || 'N/A' }}

            Detailed test-report.json is attached below.
          attachments: test-report.json
        # Only run if MAIL_USERNAME secret is present
        env:
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}

      # Enforce pipeline failure if tests failed
      - name: Enforce Test Stage Failure
        if: steps.run_tests.outcome != 'success'
        run: |
          echo "::error::One or more automated tests failed! Failing CI pipeline stage as required by specification."
          exit 1

  # Bonus Task 1: Conditional Deployment to GitHub Pages
  # Deploys ONLY on push to main AND ONLY when all automated tests pass!
  deploy-pages:
    name: Conditional Deploy to GitHub Pages (Bonus)
    needs: test
    if: success() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Static Frontend Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "docs"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

